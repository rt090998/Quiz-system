<!DOCTYPE html>
<html>
<head>
    <title>智力王 - 2x2 粉紅計分板</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body { 
            background: transparent; 
            font-family: 'ZCOOL KuaiLe', 'Microsoft JhengHei', cursive; 
            margin: 0; 
            overflow: hidden; 
        }

        /* 改用 Grid 佈局 */
        .leaderboard { 
            display: grid;
            /* 定義兩欄，每欄寬度平均分配 */
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            padding: 20px; 
            width: 800px; /* 闊度加大以容納兩列 */
        }

        .player-row { 
            display: flex; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #FFB6C1; 
            padding: 10px 20px; 
            border-radius: 50px; 
            box-shadow: 0 6px 0px #FFB6C1; 
            transition: all 0.3s ease;
        }

        .avatar { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            border: 3px solid #FFF; 
            margin-right: 12px; 
            background: #FFE4E1;
            object-fit: cover;
        }

        .name { 
            flex-grow: 1; 
            font-size: 22px; 
            color: #FF69B4; 
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score { 
            font-size: 32px; 
            color: #FF69B4; 
            font-weight: bold;
            text-shadow: 2px 2px 0px #FFF;
            margin-left: 10px;
        }

        /* 得分動畫 */
        .score-pop { animation: pop 0.3s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="leaderboard" id="board"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let oldScores = {};

        socket.on('updateData', (players) => {
            const board = document.getElementById('board');
            // 依然按分數排序，但會填滿 2x2 空間
            const sorted = Object.keys(players).sort((a, b) => players[b].score - players[a].score);
            
            board.innerHTML = sorted.map(name => {
                const p = players[name];
                const scoreClass = (oldScores[name] !== undefined && oldScores[name] !== p.score) ? 'score-pop' : '';
                oldScores[name] = p.score;

                return `
                    <div class="player-row">
                        <img class="avatar" src="${p.avatar}">
                        <div class="name">${name}</div>
                        <div class="score ${scoreClass}">${p.score}</div>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
