<!DOCTYPE html>
<html>
<head>
    <title>計分大熒幕</title>
    <style>
        body { font-family: 'Arial Black', sans-serif; background: transparent; color: white; overflow: hidden; }
        .container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 50px; }
        .card { 
            background: rgba(0, 0, 0, 0.8); border: 4px solid gold; border-radius: 15px;
            padding: 20px; width: 150px; text-align: center;
            transition: all 0.5s ease; /* 分數變動時的平滑效果 */
        }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid white; object-fit: cover; }
        .score { font-size: 48px; color: gold; margin-top: 10px; }
        .name { font-size: 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container" id="display"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('updateData', (players) => {
            const display = document.getElementById('display');
            display.innerHTML = "";
            
            // 將玩家按分數高低排序
            const sortedNames = Object.keys(players).sort((a, b) => players[b].score - players[a].score);

            sortedNames.forEach(name => {
                const p = players[name];
                display.innerHTML += `
                    <div class="card">
                        <img class="avatar" src="${p.avatar}">
                        <div class="name">${name}</div>
                        <div class="score">${p.score}</div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
